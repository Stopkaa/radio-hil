# Radios of the interop test (see README.md)
#
# radios.<name>:
#   board:  RIOT board; the exemplars are found by it in 'radio-hil list'
#   phys:   bands/modulations the radio can do (keys of 'phys' below)
#   make:   extra build variables, passed to make as environment variables
#           (so they are added to what the board sets, like USEMODULE=... make)
#
# Two radios are paired if they have a phy in common. A radio with two or
# more exemplars also runs against itself.

radios:
  nrf52840dk:
    board: nrf52840dk
    phys: [oqpsk-2.4]
  samr21-xpro:
    board: samr21-xpro
    phys: [oqpsk-2.4]
  pba-d-01-kw2x:
    board: pba-d-01-kw2x
    phys: [oqpsk-2.4]
  frdm-kw41z:
    board: frdm-kw41z
    phys: [oqpsk-2.4]
  openmote-b-at86rf215:          # first variant: flashed on the OpenMote-B first
    board: openmote-b
    phys: [oqpsk-2.4]
  openmote-b-cc2538:
    board: openmote-b
    phys: [oqpsk-2.4]
    make: {DISABLE_MODULE: at86rf215, USEMODULE: cc2538_rf}
  esp32c6-devkit:
    board: esp32c6-devkit
    phys: [oqpsk-2.4]
    make: {USEMODULE: esp_ieee802154}
  mrf24j40:                      # rpi-mrf-radio-shield on the Arduino header
    board: nucleo-f103rb
    phys: [oqpsk-2.4]
    make:
      USEMODULE: mrf24j40
      CFLAGS: >-
        -DMRF24J40_PARAM_SPI=SPI_DEV\(0\)
        -DMRF24J40_PARAM_SPI_CLK=SPI_CLK_5MHZ
        -DMRF24J40_PARAM_CS=ARDUINO_PIN_10
        -DMRF24J40_PARAM_INT=ARDUINO_PIN_7
        -DMRF24J40_PARAM_RESET=ARDUINO_PIN_5
  samr30-xpro:
    board: samr30-xpro
    phys: [oqpsk-subghz]

phys:
  oqpsk-2.4:
    band: 2.4ghz
    channels: [15, 20, 26]       # not on WLAN 1/6/11, at least 25 MHz apart
  oqpsk-subghz:
    band: subghz
    channels: [0]                # 868.3 MHz, the only O-QPSK channel in the EU

# pairs that are not tested, e.g. [[frdm-kw41z, mrf24j40]]
exclude: []

# Ping runs per direction, in this order. Add, remove or change entries;
# with --pings NAME only some of them run (e.g. --pings short).
test:
  pings:
    - name: short                  # unfragmented, ~5 min
      size: 10                     # ping -s, payload in bytes
      count: 10000                 # ping -c
      interval: 30                 # ping -i, ms between pings
    - name: long                   # fragmented, ~50 min
      size: 1024
      count: 10000
      interval: 300
  # optional per ping: timeout (ms, ping -W) and max_loss, otherwise these:
  ping_timeout: 1000    # ms, ping -W
  max_loss: 10          # percent; a ping run passes below this
  pktbuf_wait: 10       # seconds to wait after a ping before checking pktbuf
  stop_on_fail: true    # true: the next ping run only runs if this one passed
